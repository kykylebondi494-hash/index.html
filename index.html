let cart = [];
let guideStep = 1;
document.addEventListener('DOMContentLoaded', () => {
renderCatalogue(products);
updateCartDisplay();
});
function renderCatalogue(items) {
const grid = document.getElementById('productsGrid');
if(!grid) return;
grid.innerHTML = '';
if(items.length === 0) {
grid.innerHTML = <p style="text-align:center; grid-column: 1/-1; padding: 40px; color: var(--text-muted);">Aucun produit ne correspond à votre recherche actuelle...</p>;
return;
}
items.forEach(prod => {
const card = document.createElement('div');
card.className = 'product-card';
card.innerHTML = <div class="product-img-container"> <span class="product-tag">${prod.tag}</span> <img src="${prod.img}" alt="${prod.title}"> </div> <div class="product-info"> <h3 class="product-title">${prod.title}</h3> <p class="product-desc">${prod.desc}</p> <div class="product-action-row"> <div class="product-price-qty"> <span class="product-price">${prod.price.toFixed(2)}€</span> <div class="qty-selector"> <button class="qty-btn" onclick="adjustInputQty(${prod.id}, -1, event)"><i class="fa-solid fa-minus"></i></button> <span class="qty-value" id="input-qty-${prod.id}">1</span> <button class="qty-btn" onclick="adjustInputQty(${prod.id}, 1, event)"><i class="fa-solid fa-plus"></i></button> </div> </div> <button class="btn-add-cart" onclick="addToCartTrigger(${prod.id})"> <i class="fa-solid fa-cart-plus"></i> Ajouter au panier </button> </div> </div>;
grid.appendChild(card);
});
}
function adjustInputQty(productId, amount, event) {
event.stopPropagation();
const qtyLabel = document.getElementById(input-qty-${productId});
if(!qtyLabel) return;
let currentQty = parseInt(qtyLabel.innerText);
currentQty += amount;
if(currentQty < 1) currentQty = 1;
qtyLabel.innerText = currentQty;
}
function filterProducts() {
const query = document.getElementById('searchInput').value.toLowerCase().trim();
const filtered = products.filter(p =>
p.title.toLowerCase().includes(query) ||
p.tag.toLowerCase().includes(query) ||
p.desc.toLowerCase().includes(query)
);
renderCatalogue(filtered);
}
function addToCartTrigger(productId) {
const product = products.find(p => p.id === productId);
const inputQtyElement = document.getElementById(input-qty-${productId});
if(!product || !inputQtyElement) return;
const quantityToAdd = parseInt(inputQtyElement.innerText);
const existingItem = cart.find(item => item.product.id === productId);
if(existingItem) {
existingItem.quantity += quantityToAdd;
} else {
cart.push({ product: product, quantity: quantityToAdd });
}
inputQtyElement.innerText = '1';
showToast(Ajouté : ${quantityToAdd}x ${product.title});
updateCartDisplay();
}
function updateCartDisplay() {
const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
document.getElementById('globalCartBadge').innerText = totalItemsCount;
const listContainer = document.getElementById('cartItemsList');
const summaryCount = document.getElementById('summaryCount');
const summaryTotal = document.getElementById('summaryTotal');
if(!listContainer) return;
if(cart.length === 0) {
listContainer.innerHTML = <div class="cart-empty-msg"><i class="fa-solid fa-basket-shopping" style="font-size:3rem; margin-bottom:15px; color:var(--purple-magic);"></i><p>Votre panier SunShopy est vide.</p></div>;
summaryCount.innerText = "0";
summaryTotal.innerText = "0.00€";
return;
}
listContainer.innerHTML = '';
let finalPrice = 0;
cart.forEach(item => {
const rowPrice = item.product.price * item.quantity;
finalPrice += rowPrice;
const itemRow = document.createElement('div');
itemRow.className = 'cart-item';
itemRow.innerHTML = <img src="${item.product.img}" class="cart-item-img" alt="${item.product.title}"> <div class="cart-item-details"> <div class="cart-item-title">${item.product.title}</div> <div class="cart-item-price">${item.product.price.toFixed(2)}€ x ${item.quantity} = ${rowPrice.toFixed(2)}€</div> </div> <div class="cart-item-actions"> <div class="qty-selector"> <button class="qty-btn" onclick="changeCartQty(${item.product.id}, -1)"><i class="fa-solid fa-minus"></i></button> <span class="qty-value">${item.quantity}</span> <button class="qty-btn" onclick="changeCartQty(${item.product.id}, 1)"><i class="fa-solid fa-plus"></i></button> </div> <button class="btn-remove-item" onclick="removeProductFromCart(${item.product.id})"><i class="fa-solid fa-trash-can"></i></button> </div>;
listContainer.appendChild(itemRow);
});
summaryCount.innerText = totalItemsCount;
summaryTotal.innerText = finalPrice.toFixed(2) + "€";
}
function changeCartQty(productId, amount) {
const item = cart.find(i => i.product.id === productId);
if(item) {
item.quantity += amount;
if(item.quantity <= 0) {
removeProductFromCart(productId);
return;
}
updateCartDisplay();
}
}
function removeProductFromCart(productId) {
cart = cart.filter(item => item.product.id !== productId);
showToast("Article retiré du panier");
updateCartDisplay();
}
function checkout() {
if(cart.length === 0) {
alert("Votre panier est vide, impossible de finaliser !");
return;
}
alert("Redirection en cours vers l'interface de paiement sécurisé PayPal...\nVotre compte sera débité uniquement du montant exact de vos produits numériques.");
cart = [];
updateCartDisplay();
switchPage('accueil');
}
function switchPage(pageId) {
document.querySelectorAll('.page-section').forEach(section => {
section.classList.remove('active');
});
document.querySelectorAll('.nav-link').forEach(link => {
link.classList.remove('active');
});
document.getElementById(page-${pageId}).classList.add('active');
document.getElementById(link-${pageId}).classList.add('active');
window.scrollTo(0,0);
}
function toggleFaq(button) {
const parent = button.parentElement;
const content = parent.querySelector('.faq-content');
if(parent.classList.contains('active')) {
parent.classList.remove('active');
content.style.maxHeight = null;
} else {
document.querySelectorAll('.faq-item').forEach(item => {
item.classList.remove('active');
item.querySelector('.faq-content').style.maxHeight = null;
});
parent.classList.add('active');
content.style.maxHeight = content.scrollHeight + "px";
}
}
function togglePricingPlan() {
const isAnnual = document.getElementById('billingToggle').checked;
const labelM = document.getElementById('label-mensuel');
const labelA = document.getElementById('label-annuel');
const pPremium = document.getElementById('price-premium');
const pPlus = document.getElementById('price-plus');
const pAdvanced = document.getElementById('price-advanced');
const perPremium = document.getElementById('period-premium');
const perPlus = document.getElementById('period-plus');
const perAdvanced = document.getElementById('period-advanced');
if (isAnnual) {
labelM.classList.remove('active');
labelA.classList.add('active');
pPremium.innerText = "49.90€"; perPremium.innerText = "/an";
pPlus.innerText = "99.90€"; perPlus.innerText = "/an";
pAdvanced.innerText = "199.90€"; perAdvanced.innerText = "/an";
} else {
labelM.classList.add('active');
labelA.classList.remove('active');
pPremium.innerText = "4.99€"; perPremium.innerText = "/mois";
pPlus.innerText = "9.99€"; perPlus.innerText = "/mois";
pAdvanced.innerText = "19.99€"; perAdvanced.innerText = "/mois";
}
}
function triggerSubscription(planName) {
const isAnnual = document.getElementById('billingToggle').checked;
const textPeriod = isAnnual ? "chaque ANNEE" : "chaque MOIS";
alert(Création de l'autorisation de prélèvement automatique PayPal / Bancaire pour l'offre : [ ${planName} ].\nVous serez automatiquement débité(e) ${textPeriod} à date fixe jusqu'à ce que vous stoppiez l'abonnement.);
}
function showToast(message) {
const toast = document.getElementById('cartToast');
if(!toast) return;
document.getElementById('toastMessage').innerText = message;
toast.classList.add('show');
setTimeout(() => {
toast.classList.remove('show');
}, 3000);
}
function advanceGuide() {
const t = document.getElementById('guideTitle');
const txt = document.getElementById('guideText');
const btn = document.getElementById('btnGuideNext');
guideStep++;
if(guideStep === 2) {
t.innerText = "🔍 Recherche instantanée";
txt.innerText = "Utilisez notre barre de recherche magique d'Halloween pour filtrer instantanément les Robux, packs de jeux FIFA/FC 25, licences GTA 6 ou abonnements.";
} else if(guideStep === 3) {
t.innerText = "💎 Avantages & Abonnements";
txt.innerText = "Rendez-vous dans la rubrique 'Abonnements' pour découvrir les grades Premium (Jaune), Premium Plus (Orange) ou Élite Avancées (Violet) avec paiements récurrents sans engagement.";
btn.innerText = "Commencer la visite";
} else {
document.getElementById('guideOverlay').style.display = 'none';
}
}
